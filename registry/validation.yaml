# Tier promotions (spec §2.3, D-09).
#
# An exercise reaches Tier B only when its rep segmentation passes the §10 L2 gates
# (rep-count MAE < 0.5, off-by-one accuracy > 0.90) on hand-annotated REAL clips.
# A cue reaches Tier A only with labeled data, alpha >= 0.67, calibration, SC-2 and SC-3.
#
# Each promotion must cite a committed file under eval/results/ whose evidence is marked
# admissible. Synthetic results are never admissible. Promotions are made by hand, in a
# reviewed change — never written by a script.

