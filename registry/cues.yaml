# Cue registry — spec §3.4.
#
# Transcribed row-for-row from the §3.4 table. That table has 56 rows; the spec's
# prose said 52. See spec erratum E-01.
#
# expected_tier is a PRE-REGISTERED prediction (D-12), not a measurement.
# Do not edit it after data collection begins; being wrong is a finding.
#
# detector:
#   planned      — no detector exists; the report lists it under "not assessed".
#   implemented  — a rule detector exists (D-08). Its `params` are PROVISIONAL until
#                  re-selected on a validation split at M4 (§6.2). A provisional
#                  detector can never produce a user-visible claim (D-18).

