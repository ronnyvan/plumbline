name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: make lint PY=python
      - name: Tests (unit, property, golden)
        run: make test PY=python
      - name: Leakage gate (§10.7)
        run: make check-leakage PY=python
      - name: Committed results reproduce (§0.1, §10.6)
        # Fails if the pipeline changed without regenerating eval/results/eval.json in the same commit.
        run: make verify PY=python
